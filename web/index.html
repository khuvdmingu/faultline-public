<!doctype html>
<html lang="ko" data-astryx-theme="neutral">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Faultline</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@astryxdesign/core@0.1.3/src/reset.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@astryxdesign/core@0.1.3/dist/astryx.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@astryxdesign/theme-neutral@0.1.3/dist/theme.css">
<link rel="stylesheet" href="/web/styles.css">
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand"><h1>Faultline</h1><p>행동 사이의 단층선(tension)에서 시나리오를 캐는 시스템</p></div>
    <div class="controls">
      <label class="inline">실험 <select id="root" aria-label="실험 선택"></select></label>
      <span id="synthBadge" class="badge" hidden>합성 데이터</span>
      <label class="inline" id="polishWrap" hidden title="70 윤문(im-not-ai)을 통과한 문장으로 보여준다. 끄면 모델이 처음 쓴 원문."><input type="checkbox" id="polish"> 윤문본</label>
      <label class="inline" title="정답 라벨·채점·품질 검사를 보여준다. 블라인드 검토 중에는 끈다."><input type="checkbox" id="evaluator"> 평가자 모드</label>
    </div>
  </div>
  <nav class="tabs" role="tablist" aria-label="보기" id="tabs"></nav>
</header>
<main id="main"></main>
<script type="module" src="/web/js/main.js"></script>
</body>
</html>
